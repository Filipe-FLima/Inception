; Pool configuration
[www]

; Unix user/group of PHP-FPM worker processes
user = www-data
group = www-data

; Listen for FastCGI requests on TCP port 9000 (Docker networking)
listen = 0.0.0.0:9000

; Process manager configuration
; How the process manager will control the number of child processes
pm = dynamic
; The number of child processes to be created when pm is set to 'static' and the
; maximum number of child processes when pm is set to 'dynamic' or 'ondemand'.
pm.max_children = 5
; The number of child processes created on startup
pm.start_servers = 2
; The desired minimum number of idle server processes
pm.min_spare_servers = 1
; The desired maximum number of idle server processes
pm.max_spare_servers = 3

; Allow environment variables to be visible to PHP (getenv, $_ENV, $_SERVER)
clear_env = no

