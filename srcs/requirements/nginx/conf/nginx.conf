server {
	# Listen on port 443 using HTTPS (TLS) with HTTP/2 support for both IPv4 and IPv6
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name flima.42.fr;

	# Allow only modern TLS versions (1.2 and 1.3) during the cryptographic handshake
	ssl_protocols TLSv1.2 TLSv1.3;

	# Path to server TLS certificate and private key
	ssl_certificate /etc/nginx/ssl/tls_certificate.crt;
	ssl_certificate_key /etc/nginx/ssl/tls_certificate.key;

	# Document root for WordPress files and default entry point for directory requests
	root /var/www/html;
	index index.php;

	# Fallback to index.php for dynamic routing, preserving query parameters
	location / {
		try_files $uri $uri/ /index.php$is_args$args;
	}

	# Delegate PHP execution to the PHP-FPM backend using FastCGI,
	# ensuring correct script resolution and PATH_INFO handling
	location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}