services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb-inception
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    networks:
      - inception
    secrets:
      - db_password
      - db_root_password

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress-inception
    depends_on:
      - mariadb
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    restart: always
    expose:
      - "${WORDPRESS_PORT:-9000}"
    networks:
      - inception
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx-inception
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    restart: always
    ports:
      - "${PORT:-443}:443"
    networks:
      - inception

secrets:
  db_password:
    file: ./secrets/mysql_password.txt
  db_root_password:
    file: ./secrets/mysql_root_password.txt
  wp_user_password:
    file: ./secrets/wp_user_password.txt
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt

networks:
  inception:
    driver: bridge

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/flima/data/mariadb
      o: bind
  wordpress:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/flima/data/wordpress
      o: bind